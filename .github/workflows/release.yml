name: Release

on:
  workflow_dispatch:
  pull_request:
    types: [closed]

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'update-ranges') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: echo "tag=$(git describe --tags `git rev-list --tags --max-count=1`)" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.get_tag.outputs.tag }}"
          echo "Current version: $major.$minor.$patch"
          echo "Bumping patch version..."
          echo "version=$major.$minor.$((patch + 1))" >> $GITHUB_OUTPUT

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: List changed registration groups
        run: |
          git show "${{ steps.get_tag.outputs.tag }}:src/Biblys/Isbn/groups-array.php" > "$RUNNER_TEMP/previous-groups-array.php"
          php bin/ranges-changes.php "$RUNNER_TEMP/previous-groups-array.php" src/Biblys/Isbn/groups-array.php > "$RUNNER_TEMP/ranges-changes.md"
          cat "$RUNNER_TEMP/ranges-changes.md"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.bump_version.outputs.version }} --title ${{ steps.bump_version.outputs.version }} --latest --generate-notes --notes-file "$RUNNER_TEMP/ranges-changes.md"
